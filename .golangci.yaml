version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errcheck
    - gocyclo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - prealloc
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true
    errcheck:
      check-type-assertions: true
      check-blank: false
      disable-default-exclusions: true
  exclusions:
    paths:
      - vendor

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - vendor
